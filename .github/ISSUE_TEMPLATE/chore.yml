
name: "🔧 Chore"
description: "프로젝트 설정 및 기타 유지보수 작업에 사용합니다."
title: "[Chore] "

body:
  - type: textarea
    id: description
    attributes:
      label: "🔧 작업 내용"
      description: "진행할 작업과 목적을 설명해 주세요."
      placeholder: "ESLint 및 Prettier 설정을 추가합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📋 작업 항목"
      description: "수행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: "🌿 브랜치명"
      description: "영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요."
      placeholder: "eslint-prettier"
    validations:
      required: true
