
name: "📝 Docs"
description: "문서를 작성하거나 수정할 때 사용합니다."
title: "[Docs] "

body:
  - type: textarea
    id: description
    attributes:
      label: "📝 문서 작업 내용"
      description: "작성하거나 수정할 문서와 작업 목적을 설명해 주세요."
      placeholder: "README에 프로젝트 실행 방법을 추가합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📋 작업 항목"
      description: "수행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: "🌿 브랜치명"
      description: "영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요."
      placeholder: "update-readme"
    validations:
      required: true
