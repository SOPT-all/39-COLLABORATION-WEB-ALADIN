
name: "✨ Feature"
description: "새로운 기능을 개발할 때 사용합니다."
title: "[Feat] "

body:
  - type: textarea
    id: description
    attributes:
      label: "💡 제안하는 기능"
      description: "구현할 기능에 대해 설명해 주세요."
      placeholder: "로그인 페이지 UI를 구현합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📋 작업 항목"
      description: "수행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: "🌿 브랜치명"
      description: "영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요. 이슈 번호는 자동으로 추가됩니다."
      placeholder: "login-page"
    validations:
      required: true
