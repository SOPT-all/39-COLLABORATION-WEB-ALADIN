
name: "🐛 Fix"
description: "버그 및 오류를 수정할 때 사용합니다."
title: "[Fix] "

body:
  - type: textarea
    id: description
    attributes:
      label: "🐛 발생한 문제"
      description: "어떤 문제가 발생했는지 설명해 주세요."
      placeholder: "로그인 버튼 클릭 시 페이지가 이동하지 않습니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📋 작업 항목"
      description: "수정할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: "🌿 브랜치명"
      description: "영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요."
      placeholder: "login-error"
    validations:
      required: true
