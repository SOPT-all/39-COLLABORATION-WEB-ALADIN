
name: "♻️ Refactor"
description: "기존 코드 구조를 개선할 때 사용합니다."
title: "[Refactor] "

body:
  - type: textarea
    id: description
    attributes:
      label: "♻️ 리팩터링 대상 및 이유"
      description: "개선할 코드와 리팩터링이 필요한 이유를 설명해 주세요."
      placeholder: "중복된 버튼 컴포넌트를 공통 컴포넌트로 분리합니다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "📋 작업 항목"
      description: "수행할 작업을 체크리스트로 작성해 주세요."
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: branch-name
    attributes:
      label: "🌿 브랜치명"
      description: "영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요."
      placeholder: "button-component"
    validations:
      required: true
