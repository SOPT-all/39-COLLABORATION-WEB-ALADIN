
name: Auto Issue and PR Management

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auto-management-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  queue: max

jobs:
  assign-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Assign author and type labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isIssue = context.eventName === "issues";
            const item = isIssue
              ? context.payload.issue
              : context.payload.pull_request;

            const number = item.number;
            const author = item.user.login.toLowerCase();

            // Issue 및 PR 작성자를 Assignee로 자동 지정
            const currentAssignees = item.assignees ?? [];

            const alreadyAssigned = currentAssignees.some(
              assignee =>
                assignee.login.toLowerCase() === author
            );

            if (!alreadyAssigned) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: number,
                assignees: [item.user.login]
              });
            }

            // GitHub 아이디 → 실제 라벨 이름
            const members = {
              "yebeenchoi": "🦈 예빈",
              "yumin-kim2": "🐯 유민",
              "hycho04": "🐱 현영",
              "kimxeesoo": "🦊 희수"
            };

            // 제목 타입 → 실제 라벨 이름
            const typeLabels = {
              feat: "✨ Feat",
              feature: "✨ Feat",
              fix: "🐞 Fix",
              refactor: "♻️ Refactor",
              chore: "🔧 Chore",
              docs: "📝 Docs",
              style: "🎨 Style",
              api: "🔗 API",
              deploy: "🚀 Deploy"
            };

            const managedLabels = [
              ...new Set([
                ...Object.values(members),
                ...Object.values(typeLabels)
              ])
            ];

            // 제목 앞 [타입] 추출
            const match = item.title.match(/^\s*\[([^\]]+)\]/);
            const type = match?.[1].trim().toLowerCase();

            const desiredLabels = [
              members[author],
              typeLabels[type]
            ].filter(Boolean);

            // 현재 붙어 있는 라벨 확인
            const currentLabels = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              {
                owner,
                repo,
                issue_number: number,
                per_page: 100
              }
            );

            const currentNames = currentLabels.map(
              label => label.name
            );

            // 이전 자동 관리 라벨 중 불필요한 것 제거
            for (const label of currentNames) {
              if (
                managedLabels.includes(label) &&
                !desiredLabels.includes(label)
              ) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: label
                });
              }
            }

            // 아직 없는 라벨만 추가
            const labelsToAdd = desiredLabels.filter(
              label => !currentNames.includes(label)
            );

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: labelsToAdd
              });
            }

            core.info(
              `#${number}: ${desiredLabels.join(", ")}`
            );

  assign-reviewers:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Request team reviewers
        id: request-reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login.toLowerCase();

            const members = [
              "YeBeenChoi",
              "yumin-kim2",
              "hycho04",
              "kimxeesoo"
            ];

            // 프로젝트 팀원 PR만 처리
            const isMember = members.some(
              user => user.toLowerCase() === author
            );

            if (!isMember) {
              core.info("프로젝트 팀원이 아니므로 건너뜁니다.");
              return;
            }

            // 현재 리뷰 요청 목록 조회
            const requested = await github.rest.pulls.listRequestedReviewers({
              owner,
              repo,
              pull_number: pr.number
            });

            const requestedUsers = new Set(
              requested.data.users.map(
                user => user.login.toLowerCase()
              )
            );

            // 이미 리뷰를 제출한 팀원 조회
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const reviewedUsers = new Set(
              reviews
                .filter(review =>
                  review.state !== "DISMISSED" &&
                  review.state !== "PENDING"
                )
                .map(review => review.user.login.toLowerCase())
            );

            // 작성자, 기존 요청자, 리뷰 완료자 제외
            const reviewers = members.filter(user => {
              const login = user.toLowerCase();
              return (
                login !== author &&
                !requestedUsers.has(login) &&
                !reviewedUsers.has(login)
              );
            });

            if (reviewers.length === 0) {
              core.info("추가로 요청할 리뷰어가 없습니다.");
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: pr.number,
                reviewers
              });

              core.info(
                `리뷰어 요청 완료: ${reviewers.join(", ")}`
              );
              core.setOutput("reviewers", JSON.stringify(reviewers));
            } catch (error) {
              core.warning(
                `리뷰어 요청 실패: ${error.message}`
              );
              core.setFailed(
                "팀원의 저장소 권한 및 리뷰어 요청 가능 여부를 확인하세요."
              );
            }

      - name: Checkout trusted base branch
        if: steps.request-reviewers.outputs.reviewers != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send Discord review request
        if: steps.request-reviewers.outputs.reviewers != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DISCORD_EVENT_NAME: review_request
          REVIEWERS_JSON: ${{ steps.request-reviewers.outputs.reviewers }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/discordNotify.py"
